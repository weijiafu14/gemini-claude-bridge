[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-claude-bridge"
version = "0.1.0"
description = "Production-grade Gemini ↔ Anthropic Messages API protocol converter"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "weijiafu14" }]
keywords = ["gemini", "claude", "anthropic", "google", "ai", "proxy", "protocol-converter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
proxy = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://github.com/weijiafu14/gemini-claude-bridge"
Repository = "https://github.com/weijiafu14/gemini-claude-bridge"
Issues = "https://github.com/weijiafu14/gemini-claude-bridge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_claude_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
